spring.application.name=secure-backend-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/secure_backend_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# DEMO ONLY fallback keys for a local classroom exercise. Replace via environment variables before any real use.
app.jwt.secret-base64=${JWT_SECRET_BASE64:ZGVtby1qd3Qtc2VjcmV0LWZvci1sb2NhbC1sYWItb25seS0zMi1ieXRlcw==}
app.jwt.access-token-minutes=5
app.jwt.refresh-token-days=7
app.aes.secret-base64=${AES_SECRET_BASE64:ZGVtby1hZXMta2V5LWZvci1sb2NhbC1sYWItMzJieXQ=}
